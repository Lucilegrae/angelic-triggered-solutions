name: Supabase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "=== WORKSPACE ROOT ==="
          pwd
          ls -R .

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify environment
        run: |
          echo "=== VERIFY SUPABASE DIR ==="
          ls -R "$GITHUB_WORKSPACE/angelic-triggered-solutions/angelic-triggered-solutions/supabase"
          supabase --version

      - name: Deploy public-jwks
        run: |
          echo "=== ENTERING SUPABASE PROJECT ==="
          cd "$GITHUB_WORKSPACE/angelic-triggered-solutions/angelic-triggered-solutions/supabase"

          supabase functions deploy public-jwks \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --debug

gname: Supabase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}

    defaults:
      run:
        working-directory: ats-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "=== WORKSPACE ROOT ==="
          pwd
          ls -R .

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify environment
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== SUPABASE FUNCTIONS ==="
          ls -R supabase/functions

          echo "=== CLI VERSION ==="
          supabase --version

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF"

     - name: Deploy public-jwks
       run: |
         cd $GITHUB_WORKSPACE/ats-portal/supabase
         supabase functions deploy public-jwks \
           --project-ref "$SUPABASE_PROJECT_REF" \
           --no-verify-jwt \
           --debug

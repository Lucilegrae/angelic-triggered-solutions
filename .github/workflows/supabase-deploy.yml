name: Supabase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    defaults:
      run:
        working-directory: ats-portal

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Supabase cache
        run: |
          rm -rf supabase/.temp

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Show Supabase CLI version
        run: |
          supabase --version

      - name: Verify Supabase project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Supabase structure:"
          ls -la supabase

          echo ""
          echo "Functions:"
          ls -R supabase/functions

          echo ""
          echo "Config:"
          cat supabase/config.toml

          echo ""
          echo "Checking config exists:"
          test -f supabase/config.toml

      - name: List deployed functions
        run: |
          supabase functions list \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --debug

      - name: Deploy public-jwks
        run: |
          cd supabase

          echo "Deploying public-jwks..."

          supabase functions deploy public-jwks \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --debug
